[project]
name = "ai-skin-specialist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akankshagupta8899@gmail.com", email = "akankshagupta8899@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepgram-sdk>=7.13.0",
    "gradio>=6.30.0",
    "groq>=1.7.0",
